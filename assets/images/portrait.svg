<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-label="Ilustrasi dua orang menatap matahari terbenam">
  <defs>
    <linearGradient id="sky6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d0512"/>
      <stop offset=".22" stop-color="#5b1233"/>
      <stop offset=".46" stop-color="#a9214f"/>
      <stop offset=".66" stop-color="#e5627f"/>
      <stop offset=".82" stop-color="#ffb489"/>
      <stop offset="1" stop-color="#ffe2c2"/>
    </linearGradient>
    <radialGradient id="sun6" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset=".42" stop-color="#ffe6b8" stop-opacity=".9"/>
      <stop offset=".75" stop-color="#ffb98a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff9d7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25060f"/>
      <stop offset="1" stop-color="#0d0206"/>
    </linearGradient>
    <radialGradient id="vig6" cx=".5" cy=".5" r=".72">
      <stop offset=".5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#12030a" stop-opacity=".62"/>
    </radialGradient>
    <filter id="blur6"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="900" height="1100" fill="url(#sky6)"/>
  <circle cx="450" cy="620" r="330" fill="url(#sun6)"/>
  <circle cx="450" cy="620" r="118" fill="#fff8e6" opacity=".9"/>
  <g fill="#ffd9c4" opacity=".38" filter="url(#blur6)">
    <ellipse cx="250" cy="290" rx="200" ry="20"/>
    <ellipse cx="660" cy="210" rx="210" ry="16"/>
    <ellipse cx="500" cy="420" rx="280" ry="22"/>
  </g>
  <path d="M0 880 Q220 820 450 856 T900 840 V1100 H0Z" fill="url(#ground6)"/>

  <!-- dua sosok dari belakang, bersandar satu sama lain -->
  <g fill="#17030a">
    <path d="M262 1100 L262 836 Q262 752 338 734 Q386 724 434 734 Q510 752 510 836 L510 1100 Z"/>
    <circle cx="386" cy="658" r="73"/>
    <path d="M470 1100 L470 872 Q470 800 538 782 Q578 772 618 782 Q686 800 686 872 L686 1100 Z"/>
    <circle cx="578" cy="704" r="64"/>
  </g>
  <!-- rim light dari arah matahari -->
  <g fill="none" stroke="#ffe6cd" stroke-linecap="round" opacity=".22">
    <path d="M441 600 a73 73 0 0 1 18 78" stroke-width="7"/>
    <path d="M625 656 a64 64 0 0 1 15 66" stroke-width="6"/>
    <path d="M510 880 q-8 -60 -4 -96" stroke-width="5"/>
  </g>
  <!-- refleksi tipis di tanah -->
  <g fill="#ffd9c4" opacity=".07">
    <path d="M300 900 q120 -22 240 0 q-120 40 -240 0Z"/>
  </g>
  <rect width="900" height="1100" fill="url(#vig6)"/>
</svg>
